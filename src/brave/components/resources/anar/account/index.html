<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anar Account</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #282828;
      --surface: #1e1e1e;
      --surface-2: #323232;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f2f2f2;
      --muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
      --ok: #34d399;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 700px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }
    body.signed-in { align-items: flex-start; padding-top: 7vh; }
    body.signed-in .card { max-width: 760px; padding: 30px 34px; }
    body.signed-in .header { flex-direction: row; text-align: start; gap: 14px; margin-bottom: 24px; }
    body.signed-in .header img { width: 38px; height: 38px; margin: 0; }
    body.signed-in .header-copy { display: flex; flex-direction: column; }
    body.signed-in .profile-row { padding: 18px; }
    body.signed-in .services-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .header img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms, opacity 120ms;
    }
    button.primary {
      background: var(--accent);
      color: #141418;
    }
    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }
    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover:not(:disabled) {
      background: #3c3c3c;
    }
    button.danger {
      background: rgba(248, 113, 113, 0.14);
      color: var(--err);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .error-box {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      font-size: 13px;
    }
    .status-note {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .links {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .profile-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: var(--accent);
      flex: 0 0 auto;
      overflow: hidden;
    }
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-meta { min-width: 0; }
    .account-list { margin: 0 0 18px; }
    .account-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .account-item span { flex: 1; overflow-wrap: anywhere; }
    .account-item button { width: auto; padding: 6px 9px; font-size: 12px; }
    .profile-name { font-weight: 600; font-size: 15px; }
    .profile-sub { font-size: 12px; color: var(--muted); }
    .security-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.12);
      color: var(--ok);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .services-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }
    .service-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      min-height: 48px;
      cursor: pointer;
    }
    .service-link:hover {
      border-color: var(--accent);
    }
    .key-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(167, 139, 250, 0.16);
      color: var(--accent);
    }
    .actions-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hidden { display: none !important; }
    @media (max-width: 600px) {
      body.signed-in .services-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body.signed-in .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="/anar-logo.png" alt="Anar">
      <div class="header-copy">
        <h1 id="page-title">Sign in with Anar Account</h1>
        <p id="page-subtitle" class="subtitle">Connect your anar.one account to this browser profile</p>
      </div>
    </div>

    <div id="error-box" class="error-box hidden"></div>

    <form id="login-form" class="hidden">
      <div class="field">
        <label for="username">Username or Anar Mail address</label>
        <input id="username" type="text" autocomplete="username" required placeholder="username or name@anarmail.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Password">
      </div>
      <button id="login-submit" type="submit" class="primary">Sign in to Anar</button>
      <div class="links">
        <a href="https://auth.anar.one/#signup" target="_blank" rel="noopener noreferrer">Create anar.one account</a>
        <a href="https://account.anar.one/" target="_blank" rel="noopener noreferrer">Anar Account Portal</a>
      </div>
    </form>
    <div id="login-status" class="status-note"></div>

    <form id="otp-form" class="hidden">
      <div class="field">
        <label for="otp-code">Anar Authenticator / Backup Code</label>
        <input id="otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456">
      </div>
      <button id="otp-submit" type="submit" class="primary">Verify Code</button>
      <div class="actions-col" style="margin-top: 10px;">
        <button id="otp-cancel" type="button" class="secondary">Back</button>
      </div>
    </form>

    <div id="signed-in-view" class="hidden">
      <div class="profile-row">
        <div id="avatar-circle" class="avatar-circle">A</div>
        <div class="profile-meta">
          <div id="profile-name" class="profile-name"></div>
          <div id="profile-sub" class="profile-sub"></div>
        </div>
      </div>

      <div class="security-pill">
        <span id="security-text">Service keys encrypted via Windows DPAPI</span>
      </div>

      <div id="account-list" class="account-list"></div>

      <div class="services-title">Anar Services</div>
      <div id="services-grid" class="services-grid"></div>

      <div class="actions-col">
        <a href="https://account.anar.one/" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
          <button type="button" class="secondary">Manage Anar Account &amp; Plans</button>
        </a>
        <button id="add-account-btn" type="button" class="secondary">Add another Anar account</button>
        <button id="reconnect-btn" type="button" class="secondary hidden">Reconnect Anar services</button>
        <button id="signout-btn" type="button" class="danger">Sign out of this profile</button>
      </div>
    </div>
  </div>

  <script src="/argon2.umd.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
